services:
  es-hot:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: es-hot
    environment:
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      node.name: es-hot
      cluster.name: elk-docker-cluster
      discovery.seed_hosts: es-hot,es-warm
      cluster.initial_master_nodes: es-hot
      node.roles: master,data_hot,data_content,ingest
      xpack.security.enabled: "false"
      xpack.license.self_generated.type: basic
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_hot_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9200'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  es-warm:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: es-warm
    environment:
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      node.name: es-warm
      cluster.name: elk-docker-cluster
      discovery.seed_hosts: es-hot,es-warm
      cluster.initial_master_nodes: es-hot
      node.roles: data_warm,data_content
      xpack.security.enabled: "false"
      xpack.license.self_generated.type: basic
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_warm_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9200'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    container_name: logstash
    environment:
      LS_JAVA_OPTS: -Xms256m -Xmx256m
      xpack.monitoring.enabled: "false"
    depends_on:
      es-hot:
        condition: service_healthy
      es-warm:
        condition: service_started
    ports:
      - "5000:5000"
      - "5044:5044"
    volumes:
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600'"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 60s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: kibana
    environment:
      SERVER_NAME: kibana
      ELASTICSEARCH_HOSTS: http://es-hot:9200
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: 0123456789abcdef0123456789abcdef
    depends_on:
      es-hot:
        condition: service_healthy
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/5601'"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 60s

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    container_name: filebeat
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    depends_on:
      logstash:
        condition: service_healthy
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  es_hot_data:
  es_warm_data: