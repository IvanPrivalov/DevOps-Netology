apiVersion: 1

groups:
  - orgId: 1
    name: node-exporter-homework
    folder: Homework 14
    interval: 1m
    rules:
      - uid: cpu_usage_high
        title: CPU usage is high
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 80
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: classic_conditions
        dashboardUid: nodeexporterhw14
        panelId: 1
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          summary: CPU usage is above 80% for 5 minutes.
        labels:
          severity: warning
          metric: cpu

      - uid: load_average_high
        title: Load average is high
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: node_load5
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 2
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: classic_conditions
        dashboardUid: nodeexporterhw14
        panelId: 2
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          summary: node_load5 is above 2 for 5 minutes.
        labels:
          severity: warning
          metric: load

      - uid: memory_free_low
        title: Free memory is low
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 20
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: classic_conditions
        dashboardUid: nodeexporterhw14
        panelId: 3
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          summary: Free memory is below 20%.
        labels:
          severity: warning
          metric: memory

      - uid: disk_free_low
        title: Free disk space is low
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.lxcfs|overlay",mountpoint="/"} / node_filesystem_size_bytes{fstype!~"tmpfs|fuse.lxcfs|overlay",mountpoint="/"}) * 100
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 15
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: classic_conditions
        dashboardUid: nodeexporterhw14
        panelId: 4
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          summary: Free disk space on / is below 15%.
        labels:
          severity: warning
          metric: disk